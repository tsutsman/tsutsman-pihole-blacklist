name: Remove one duplicate domain

on:
  push:
    branches: [fix/bandit-url-validation]

permissions:
  contents: write

jobs:
  dedupe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Remove only the duplicate occurrence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('domains.txt')
          target = '00704ae865ee.ngrok.app'
          lines = path.read_text(encoding='utf-8').splitlines()
          count = lines.count(target)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 occurrences of {target}, found {count}')

          seen = False
          result = []
          for line in lines:
              if line == target:
                  if seen:
                      continue
                  seen = True
              result.append(line)

          path.write_text('\n'.join(result) + '\n', encoding='utf-8')

          script = Path('scripts/update_domains.py')
          text = script.read_text(encoding='utf-8')
          text = text.replace(
              '# nosec B310 - scheme validated above',
              '# nosec B310',
              1,
          )
          script.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add domains.txt scripts/update_domains.py
          git diff --cached --check
          git commit -m "fix: remove duplicate domain entry"
          git push origin HEAD:${GITHUB_REF_NAME}
