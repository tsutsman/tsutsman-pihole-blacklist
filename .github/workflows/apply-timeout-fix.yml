name: Apply timeout handling fix

on:
  push:
    branches: [fix/source-timeout-handling]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply targeted timeout retry patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/update_domains.py')
          text = path.read_text(encoding='utf-8')
          old = '        except (URLError, IncompleteRead):\n'
          new = '        except (URLError, IncompleteRead, TimeoutError):\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one retry handler, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/update_domains.py
          git diff --cached --check
          git commit -m "fix: retry raw source read timeouts"
          git push origin HEAD:${GITHUB_REF_NAME}
